name: Publish - Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-jvm:
    name: Build JVM distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-enabled: false
          add-job-summary: false

      - name: Build JVM distributions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./gradlew \
            :l10n-sync:jvmDistZip \
            :l10n-weblate:jvmDistZip \
            -PreleaseVersion="$RELEASE_TAG"

      - name: Prepare JVM artifact
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir release-artifacts
          cp "l10n-sync/build/distributions/l10n-sync-$RELEASE_TAG-jvm.zip" \
            "release-artifacts/l10n-sync-$RELEASE_TAG-jvm.zip"
          cp "l10n-weblate/build/distributions/l10n-weblate-$RELEASE_TAG-jvm.zip" \
            "release-artifacts/l10n-weblate-$RELEASE_TAG-jvm.zip"

      - name: Upload JVM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm
          path: release-artifacts/*
          if-no-files-found: error

  build-native:
    name: Build ${{ matrix.target }} executables
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: LinuxX64
            output: linuxX64
            asset: linux-x64
          - os: macos-latest
            target: MacosArm64
            output: macosArm64
            asset: macos-arm64
          - os: windows-latest
            target: MingwX64
            output: mingwX64
            asset: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-enabled: false
          add-job-summary: false

      - name: Build native executables
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./gradlew \
            :l10n-sync:linkReleaseExecutable${{ matrix.target }} \
            :l10n-weblate:linkReleaseExecutable${{ matrix.target }} \
            -PreleaseVersion="$RELEASE_TAG"

      - name: Package native executable
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NATIVE_OUTPUT: ${{ matrix.output }}
          NATIVE_ASSET: ${{ matrix.asset }}
        run: |
          mkdir release-artifacts
          tar -C "l10n-sync/build/bin/$NATIVE_OUTPUT/releaseExecutable" -czf \
            "release-artifacts/l10n-sync-$RELEASE_TAG-$NATIVE_ASSET.tar.gz" l10n-sync.kexe
          tar -C "l10n-weblate/build/bin/$NATIVE_OUTPUT/releaseExecutable" -czf \
            "release-artifacts/l10n-weblate-$RELEASE_TAG-$NATIVE_ASSET.tar.gz" l10n-weblate.kexe

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NATIVE_OUTPUT: ${{ matrix.output }}
          NATIVE_ASSET: ${{ matrix.asset }}
        run: |
          New-Item -ItemType Directory -Path release-artifacts
          Compress-Archive `
            -Path "l10n-sync/build/bin/$env:NATIVE_OUTPUT/releaseExecutable/l10n-sync.exe" `
            -DestinationPath "release-artifacts/l10n-sync-$env:RELEASE_TAG-$env:NATIVE_ASSET.zip"
          Compress-Archive `
            -Path "l10n-weblate/build/bin/$env:NATIVE_OUTPUT/releaseExecutable/l10n-weblate.exe" `
            -DestinationPath "release-artifacts/l10n-weblate-$env:RELEASE_TAG-$env:NATIVE_ASSET.zip"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.asset }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-jvm, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign release artifacts
        run: |
          for artifact in release-artifacts/*; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
